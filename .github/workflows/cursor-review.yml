name: Cursor PR Review Agent

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Cursor CLI
        run: |
          # Use -k to bypass SSL certificate issues if necessary
          curl -k https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Run AI Code Review
        timeout-minutes: 3
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Command for the agent to analyze changes and post a review
          agent --trust -p "Analyze the changes in this Pull Request. Provide a concise code review focusing on potential bugs, performance improvements, and adherence to best practices. Please print out the review result in the markdown format. The review result always starts with the statement 'This review is from Cursor'" --model composer-2-fast > review_result.txt

          # Adds a comment
          if [ -s review_result.txt ]; then
              gh pr comment ${{ github.event.pull_request.number }} --body-file review_result.txt
          else
              echo "empty review"
          fi
